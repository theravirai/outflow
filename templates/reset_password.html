{% extends "base.html" %}

{% block title %}Set New Password: Outflow{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Create new password</h1>
            <p class="auth-subtitle">Please enter a new password for your account.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">
                <i data-lucide="alert-triangle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                {{ csrf_token_input() | safe }}
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="At least 8 characters"
                           required minlength="8" autofocus>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-input" placeholder="Repeat your new password"
                           required minlength="8">
                </div>
                <button type="submit" class="btn-submit">Set New Password</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
