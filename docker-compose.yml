version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://outflow_user:outflow_password@db:5432/outflow_db
      - SECRET_KEY=default-dev-secret-key-change-in-prod
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: outflow_user
      POSTGRES_PASSWORD: outflow_password
      POSTGRES_DB: outflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outflow_user -d outflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
